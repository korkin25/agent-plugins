name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Own pushes run on the owner's self-hosted runner; pull requests and anything else run on
    # GitHub-hosted runners. Workflow runs for pull requests from forks require approval.
    runs-on: ${{ (github.event_name == 'push' && github.actor == github.repository_owner) && 'pure-vps-linux-x64-agent-plugins' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Python is set up explicitly: the plugins' tools and tests are Python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: plugin-check — the same checks that run locally
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.280 >/dev/null 2>&1 \
            || echo "::warning::claude CLI unavailable; the official validator step will be skipped"
          ./plugin-factory/bin/plugin-check

      - name: plugin-test — clean room, nothing preconfigured
        run: ./plugin-factory/bin/plugin-test

      - name: subagent-model-router — unit tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B -m unittest discover -s subagent-model-router/tests
