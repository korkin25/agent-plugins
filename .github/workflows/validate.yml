name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: plugin-check — the same checks that run locally
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 \
            || echo "::warning::claude CLI unavailable; the official validator step will be skipped"
          ./plugin-factory/bin/plugin-check
