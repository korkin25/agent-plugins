name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-platforms:
    name: router telemetry (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Shared hook, delivery and dashboard tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          python3 -B subagent-model-router/tests/run_parallel.py -j 4
          DecisionTests CodexTests ContextTests TelemetryTests DashboardTests TelemetryIntegrationTests TerminalTests BrowserTests RuntimeTests RuntimeIntegrationTests ClaudeStateTests ClaudeStateIntegrationTests ClaudeModelTests

  validate:
    # Own pushes run on the owner's self-hosted runner; pull requests and anything else run on
    # GitHub-hosted runners. Workflow runs for pull requests from forks require approval.
    runs-on: ${{ (github.event_name == 'push' && github.actor == github.repository_owner) && 'pure-vps-linux-x64-agent-plugins' || 'ubuntu-latest' }}
    env:
      # The claude CLI version for the official validator: installed on GitHub-hosted runners and built
      # into the self-hosted runner image, which has to be rebuilt with it whenever it changes.
      CLAUDE_CLI_VERSION: '2.1.280'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the next step compares with earlier commits

      # Plugins to check: those with changed files. A change to the marketplace, plugin-factory or the
      # workflows checks every plugin; a range that cannot be compared checks every plugin too.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          market=.claude-plugin/marketplace.json
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="origin/main...$GITHUB_SHA"   # a new branch or tag: its changes against main
          else
            range="$BEFORE..$GITHUB_SHA"
          fi
          all=false; reason=""; tests=false; dirs=()
          if git diff --name-only -z "$range" > "$RUNNER_TEMP/changed" 2>/dev/null; then
            echo "changed in $range:"
          else
            all=true; reason="cannot compare $range"; tests=true; : > "$RUNNER_TEMP/changed"
          fi
          while IFS= read -r -d '' file; do
            echo "  $file"
            case "$file" in
              .claude-plugin/marketplace.json|plugin-factory/*|.github/workflows/*) all=true; reason=${reason:-$file} ;;
            esac
            case "$file" in subagent-model-router/*|.github/workflows/*) tests=true ;; esac
            case "$file" in */*) dirs+=("${file%%/*}") ;; esac
          done < "$RUNNER_TEMP/changed"
          if [ "$all" = true ]; then
            plugins=$(jq -r '[.plugins[].name] | join(" ")' "$market")
          else
            names=()
            while IFS= read -r dir; do
              name=$(jq -r --arg s "./$dir" '.plugins[] | select(.source == $s) | .name' "$market")
              if [ -n "$name" ]; then names+=("$name"); fi
            done < <(printf '%s\n' "${dirs[@]}" | sort -u)
            plugins="${names[*]}"
          fi
          echo "every plugin: $all${reason:+ ($reason)}"
          echo "plugins to check: ${plugins:-none}"
          echo "subagent-model-router unit tests: $tests"
          { echo "all=$all"; echo "plugins=$plugins"; echo "router_tests=$tests"; } >> "$GITHUB_OUTPUT"

      - name: marketplace — names and versions of every plugin
        run: |
          market=.claude-plugin/marketplace.json
          jq -e . "$market" >/dev/null || { echo "::error::$market is not valid JSON"; exit 1; }
          status=0
          while IFS=$'\t' read -r name source version; do
            manifest="$source/.claude-plugin/plugin.json"
            if ! jq -e . "$manifest" >/dev/null 2>&1; then
              echo "::error::$name: no valid manifest at $manifest"; status=1; continue
            fi
            ok=true
            [ "$(jq -r '.name // ""' "$manifest")" = "$name" ] \
              || { echo "::error::$name: plugin.json disagrees with the marketplace on the name"; ok=false; }
            [ "$(jq -r '.version // ""' "$manifest")" = "$version" ] \
              || { echo "::error::$name: version $version in the marketplace, $(jq -r '.version // ""' "$manifest") in plugin.json"; ok=false; }
            jq -e '.description // empty' "$manifest" >/dev/null \
              || { echo "::error::$name: plugin.json has no description"; ok=false; }
            if [ "$ok" = true ]; then echo "✓ $name $version"; else status=1; fi
          done < <(jq -r '.plugins[] | [.name, .source, (.version // "")] | @tsv' "$market")
          exit $status

      # A GitHub-hosted runner installs Node and the claude CLI on each run; the self-hosted runner image
      # has them built in, along with python3, and the step after these two only checks that.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.environment == 'github-hosted' && steps.changes.outputs.plugins != ''
        with:
          node-version: '22'

      - name: claude CLI — the pinned version, on a GitHub-hosted runner
        if: runner.environment == 'github-hosted' && steps.changes.outputs.plugins != ''
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION" >/dev/null 2>&1 \
            || echo "::warning::claude CLI unavailable; the official validator step will be skipped"

      # python3 is for plugin-test and for the unit tests below: whatever turns those tests on (a change
      # to subagent-model-router or a workflow, a range that cannot be compared) also lists a plugin.
      - name: runner image — node, python3 and the pinned claude CLI, on the self-hosted runner
        if: runner.environment == 'self-hosted' && steps.changes.outputs.plugins != ''
        run: |
          missing=""
          for tool in node claude python3; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::the runner image lacks:$missing; the image and this workflow have diverged," \
                 "this job needs node, claude and python3"
            exit 1
          fi
          version=$(claude --version | head -n 1)
          case "$version" in
            "$CLAUDE_CLI_VERSION" | "$CLAUDE_CLI_VERSION "*) ;;
            *) echo "::error::the runner image has claude ${version:-of no known version}, this workflow" \
                    "pins $CLAUDE_CLI_VERSION; the image and this workflow have diverged"
               exit 1 ;;
          esac
          echo "claude $version, node $(node --version), $(python3 --version)"

      - name: plugin-check — changed plugins, with the official validator
        env:
          ALL: ${{ steps.changes.outputs.all }}
          PLUGINS: ${{ steps.changes.outputs.plugins }}
        run: |
          if [ -z "$PLUGINS" ]; then echo "no plugin changed: plugin-check skipped"; exit 0; fi
          if [ "$ALL" = true ]; then exec ./plugin-factory/bin/plugin-check; fi
          status=0
          for plugin in $PLUGINS; do ./plugin-factory/bin/plugin-check "$plugin" || status=1; done
          exit $status

      - name: plugin-test — clean room, changed plugins
        env:
          ALL: ${{ steps.changes.outputs.all }}
          PLUGINS: ${{ steps.changes.outputs.plugins }}
        run: |
          if [ -z "$PLUGINS" ]; then echo "no plugin changed: plugin-test skipped"; exit 0; fi
          if [ "$ALL" = true ]; then exec ./plugin-factory/bin/plugin-test; fi
          status=0
          for plugin in $PLUGINS; do ./plugin-factory/bin/plugin-test "$plugin" || status=1; done
          exit $status

      - name: subagent-model-router — unit tests, one process per test class
        env:
          RUN: ${{ steps.changes.outputs.router_tests }}
          TMPDIR: ${{ runner.temp }}
        run: |
          if [ "$RUN" != true ]; then
            echo "subagent-model-router and the workflows are unchanged: unit tests skipped"; exit 0
          fi
          python3 --version
          python3 -B subagent-model-router/tests/run_parallel.py -j 4
