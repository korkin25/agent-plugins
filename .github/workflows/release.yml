name: release

on:
  push:
    branches: [main]
    paths:
      - '**/.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
  # Manual trigger, so a release can be cut or re-attempted without an
  # artificial commit to a manifest.
  workflow_dispatch:

permissions:
  contents: write

# Releases run one at a time and are never cancelled halfway through tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only pushes to main and manual runs start this job, never code from forks, so it runs on the
    # owner's self-hosted runner.
    runs-on: pure-vps-linux-x64-agent-plugins
    steps:
      - name: Check the runner has gh, jq and git
        run: |
          missing=""
          for tool in gh jq git; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::the runner image lacks:$missing; the release job needs gh, jq and git"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Users only receive an update when the version is bumped, so the bump is
      # the release signal. Tagging it makes that visible in git history and
      # gives people something to diff against.
      - name: Tag and release any plugin whose version changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          market=$(jq -r .name .claude-plugin/marketplace.json)
          jq -r '.plugins[] | .name + " " + .source' .claude-plugin/marketplace.json |
          while read -r name source; do
            version=$(jq -r .version "$source/.claude-plugin/plugin.json")
            tag="$name-v$version"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already tagged - nothing to release"
              continue
            fi

            notes=$(printf '%s\n%s\n\n%s\n' \
              "Install:" \
              "    /plugin marketplace add $REPO" \
              "    /plugin install $name@$market")

            echo "releasing $tag"
            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "$name $version" --notes "$notes"
          done
