# subagent-model-router: ~/.config/subagent-model-router/config.toml (directory 0700, file 0600).
# The SUBAGENT_MODEL_ROUTER_CONFIG variable overrides the path. An unknown key is a config error: the hook stays silent.

enabled = true
mode = "active"              # active — change the subagent call; shadow — only record the decision
provider = "typesafe"        # typesafe | openrouter
key_file = "~/.config/subagent-model-router/key"
# endpoint = ""              # default: typesafe — https://api.typesafe.ai/v1/systemone,
#                            #          openrouter — https://openrouter.ai/api/alpha/decisions
# model = ""                 # default: typesafe — jev-1.13.0, openrouter — typesafe/jev-1.13
exclude = []                 # directories and everything inside them: no request at all is made from there
timeout_seconds = 3          # for the whole Jev request, one retry included (at most 8)
# codex_bin = ""             # codex binary for the model catalog (absolute or ~/ path); the hook looks for
#                            # the codex process that runs it, then codex_bin, then codex on PATH

# claude_bin = ""            # native Claude binary; actual ancestor, this path, then absolute PATH

# Removed settings (thresholds, tier model/effort tables, observe_transcript_model)
# are ignored when migrating; check reports a warning. Delete them from your config.
# Factor policy (0.6.0). The same Jev request also asks atomic Score/Noul questions about the task
# (reasoning, spec, verification, scope, impact, review, review depth, prior failure); code turns them into a
# required capability level 1-4 and picks the cheapest ranked model that meets it. Prices never reach Jev.
# An invalid [policy] or capability_rank disables only the factor policy; routing keeps working.
[policy]
mode = "shadow"             # off — do not ask; shadow — record and compare with the Choice; active — launch its pick
min_confidence = 0.6        # below this a Score counts as its upper adjacent level (asymmetric toward capability)
strict_confidence = 0.8     # the same threshold when the task's error impact is high
review_threshold = 0.5      # review Noul at or above this makes review depth count
prior_failure_threshold = 0.5  # "earlier attempt failed" at or above this raises the level one step

[claude]
route_types = ["general-purpose"]
allowed_models = []         # [] = supported Agent aliases present in native SDK model catalogue
efforts = []                # [] = every level the native catalogue reports for each model
# Supported aliases: haiku, sonnet, opus, fable. No-effort models retain effort=null.
# capability_rank = { haiku = 1, sonnet = 2, opus = 3, fable = 4 }   # default; 1 light … 4 frontier
# check refreshes metadata without a model turn; Agent hooks read cache and refresh in background.

[codex]
route_agent_types = ["", "default", "worker"]
allowed_models = []                 # optional allowlist; [] = every model in the actual binary's catalog
# Every supported reasoning effort for each allowed model is offered directly to Jev.
# capability_rank = { "gpt-5.6-luna" = 1, "gpt-5.5" = 2, "gpt-5.6-terra" = 3 }  # none by default: the factor
#                                                     # policy then records the level but recommends no model

# Optional monitoring, shared by Claude Code and Codex. No telemetry network I/O in the hook.
# With victoriametrics the JSONL journal is no longer appended; existing files are not deleted.
# Only counters/histograms + bounded delivery state remain locally, never raw decisions or task text.
[telemetry]
backend = "local"           # local | victoriametrics | off
write_url = ""              # full URL, e.g. http://vm.example:8428/api/v1/import/prometheus
query_url = ""              # API base, e.g. http://vm.example:8428
# Cluster: write .../insert/0/prometheus/api/v1/import/prometheus; query .../select/0/prometheus
instance = "default"        # set a unique stable name for EACH writer installation; not a session ID
user = ""                   # defaults to OS login; set a stable alias to group the same person across hosts
openrouter_balance = false  # background key limit/account credits polling; no extra Jev calls
account = ""                # explicit shared alias when monitoring same OpenRouter credential on several hosts
token_file = ""             # optional separate VM Bearer token file, owner-only; never put token in URL
flush_interval_seconds = 5
timeout_seconds = 3
max_queue_events = 1000     # above this, coalesce pending aggregates; retain counts, lose time detail

# Project defaults to the nearest Git root's directory name (cwd name outside Git).
# Map local roots to a shared label when names differ across machines or collide.
# [telemetry.projects]
# "/work/my-repository" = "my-project"
